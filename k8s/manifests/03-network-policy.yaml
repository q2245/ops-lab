# NetworkPolicy 练习：默认全通 -> 限制只有同 namespace 能访问
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-allow-same-ns
  namespace: ops-lab
spec:
  podSelector:
    matchLabels:
      app: demo-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
