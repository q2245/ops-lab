# 反向代理练习：upstream 负载均衡、健康检查、限流、访问日志
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  info;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式：练习日志采集与解析就用这个结构
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt="$upstream_response_time" '
                      'upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 限流练习：每个 IP 每秒 10 个请求，突发 20
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    # upstream 练习：轮询 / 权重 / 备份 / 被动健康检查
    upstream backend_pool {
        least_conn;
        server backend-a:80 max_fails=3 fail_timeout=10s;
        server backend-b:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        location / {
            limit_req zone=perip burst=20 nodelay;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # nginx 自身状态页，可接 nginx-prometheus-exporter
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
