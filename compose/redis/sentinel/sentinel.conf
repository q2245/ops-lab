# 哨兵配置：主观下线/客观下线、选举、故障转移都由这个文件驱动
bind 0.0.0.0
protected-mode no
port 26379
dir /tmp
logfile ""

# 监控的主库，quorum=2 表示 3 个哨兵里 2 个认为挂了才判定客观下线
sentinel monitor ops-lab-master redis-master 6379 2
sentinel down-after-milliseconds ops-lab-master 5000
sentinel failover-timeout ops-lab-master 60000
sentinel parallel-syncs ops-lab-master 1
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
