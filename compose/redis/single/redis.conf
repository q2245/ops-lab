# Redis 单机配置：重点看持久化、内存策略、慢查询
bind 0.0.0.0
protected-mode no
port 6379

# 持久化：AOF + RDB 混合
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000

# 内存：练习 key 淘汰
maxmemory 256mb
maxmemory-policy allkeys-lru

# 慢查询日志：超过 10ms 记一条
slowlog-log-slower-than 10000
slowlog-max-len 128

# 打开键空间通知，后面练习事件驱动很有用
notify-keyspace-events "Ex"

# 生产里一定要设密码，这里为了方便学习先留空
# requirepass yourpassword

loglevel notice
dir /data
