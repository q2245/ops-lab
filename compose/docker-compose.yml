# ops-lab 核心编排文件
#
# 用 profile 分组，按需启动，不要一次全开（本地内存扛不住）：
#   docker compose --profile core up -d      可观测性（监控+日志+演示应用，一条命令起全套）
#   docker compose --profile tracing up -d   链路追踪
#   docker compose --profile lb up -d        负载均衡
#   docker compose --profile redis up -d     Redis 单机
#   docker compose --profile redis-ha up -d  Redis 主从 + 哨兵
#   docker compose --profile redis-cluster up -d  Redis Cluster
#   docker compose --profile db up -d        MySQL / PostgreSQL
#   docker compose --profile mq up -d        Kafka / RabbitMQ
#   docker compose --profile cicd up -d      Gitea
#   docker compose --profile linux up -d     Linux/网络练习容器

name: ops-lab

x-restart: &restart
  restart: unless-stopped

services:
  # =====================================================================
  # core：可观测性基础盘（Prometheus + Grafana + Alertmanager + exporters）
  # =====================================================================
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.5.0
    profiles: ["core"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ${LAB_ROOT:-.}/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${LAB_ROOT:-.}/compose/prometheus/rules:/etc/prometheus/rules:ro
      - ${LAB_ROOT:-.}/compose/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks: [ops]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.1
    profiles: ["core"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    volumes:
      - ${LAB_ROOT:-.}/compose/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [ops]

  grafana:
    <<: *restart
    image: grafana/grafana:12.1.0
    profiles: ["core"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${LAB_ROOT:-.}/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${LAB_ROOT:-.}/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [ops]

  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.9.1
    profiles: ["core"]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ops]

  cadvisor:
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["core"]
    privileged: true
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [ops]

  blackbox-exporter:
    <<: *restart
    image: prom/blackbox-exporter:v0.26.0
    profiles: ["core"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ${LAB_ROOT:-.}/compose/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [ops]

  # =====================================================================
  # logs：Loki + Alloy（Promtail 已 EOL，用 Alloy 作为采集器）
  # =====================================================================
  loki:
    <<: *restart
    image: grafana/loki:3.5.0
    profiles: ["core", "logs"]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ${LAB_ROOT:-.}/compose/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [ops]

  alloy:
    <<: *restart
    image: grafana/alloy:v1.8.0
    profiles: ["core"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ${LAB_ROOT:-.}/compose/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    networks: [ops]

  # =====================================================================
  # tracing：Jaeger + OpenTelemetry Collector
  # =====================================================================
  jaeger:
    <<: *restart
    image: jaegertracing/jaeger:2.6.0
    profiles: ["tracing"]
    ports:
      - "${JAEGER_PORT}:16686"
    networks: [ops]

  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: ["tracing"]
    command: ["--config=/etc/otel/config.yml"]
    ports:
      - "${OTLP_GRPC_PORT}:4317"
      - "${OTLP_HTTP_PORT}:4318"
    volumes:
      - ${LAB_ROOT:-.}/compose/otel/config.yml:/etc/otel/config.yml:ro
    depends_on: [jaeger]
    networks: [ops]

  # =====================================================================
  # lb：Nginx 反向代理 / HAProxy 四层负载均衡
  # =====================================================================
  nginx:
    <<: *restart
    image: nginx:1.29-alpine
    profiles: ["lb"]
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ${LAB_ROOT:-.}/compose/nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [ops]

  haproxy:
    <<: *restart
    image: haproxy:3.2-alpine
    profiles: ["lb"]
    ports:
      - "80:80"
      - "${HAPROXY_STATS_PORT}:8404"
    volumes:
      - ${LAB_ROOT:-.}/compose/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [ops]

  # 被负载均衡的后端，用于练习 upstream / 健康检查 / 会话保持
  backend-a:
    <<: *restart
    image: nginx:1.29-alpine
    profiles: ["lb"]
    environment:
      BACKEND_NAME: backend-a
    volumes:
      - ${LAB_ROOT:-.}/compose/nginx/backend:/usr/share/nginx/html:ro
    networks: [ops]

  backend-b:
    <<: *restart
    image: nginx:1.29-alpine
    profiles: ["lb"]
    environment:
      BACKEND_NAME: backend-b
    volumes:
      - ${LAB_ROOT:-.}/compose/nginx/backend:/usr/share/nginx/html:ro
    networks: [ops]

  # =====================================================================
  # redis：单机
  # =====================================================================
  redis:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/single/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [ops]

  # =====================================================================
  # redis-ha：一主两从 + 三哨兵
  # =====================================================================
  redis-master:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-master-data:/data
    networks: [ops]

  redis-replica-1:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data
    depends_on: [redis-master]
    networks: [ops]

  redis-replica-2:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data
    depends_on: [redis-master]
    networks: [ops]

  sentinel-1:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-sentinel", "/etc/sentinel/sentinel.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/sentinel.conf:/etc/sentinel/sentinel.conf:ro
    depends_on: [redis-master, redis-replica-1, redis-replica-2]
    networks: [ops]

  sentinel-2:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-sentinel", "/etc/sentinel/sentinel.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/sentinel.conf:/etc/sentinel/sentinel.conf:ro
    depends_on: [redis-master, redis-replica-1, redis-replica-2]
    networks: [ops]

  sentinel-3:
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-ha"]
    command: ["redis-sentinel", "/etc/sentinel/sentinel.conf"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/sentinel/sentinel.conf:/etc/sentinel/sentinel.conf:ro
    depends_on: [redis-master, redis-replica-1, redis-replica-2]
    networks: [ops]

  # 对外暴露哨兵端口，方便本机用 redis-cli -h 127.0.0.1 -p 26379 练习
  sentinel-gateway:
    <<: *restart
    image: alpine/socat:1.8.0.1
    profiles: ["redis-ha"]
    command: ["TCP-LISTEN:26379,fork,reuseaddr", "TCP:sentinel-1:26379"]
    ports:
      - "${REDIS_SENTINEL_PORT}:26379"
    depends_on: [sentinel-1]
    networks: [ops]

  # =====================================================================
  # redis-cluster：三主三从
  # =====================================================================
  redis-cluster-init:
    image: redis:8-alpine
    profiles: ["redis-cluster"]
    entrypoint: ["/bin/sh", "/scripts/cluster-init.sh"]
    volumes:
      - ${LAB_ROOT:-.}/compose/redis/cluster:/scripts:ro
    depends_on:
      - rc-1
      - rc-2
      - rc-3
      - rc-4
      - rc-5
      - rc-6
    networks: [ops]

  rc-1: &rc
    <<: *restart
    image: redis:8-alpine
    profiles: ["redis-cluster"]
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no"]
    volumes:
      - rc-1-data:/data
    networks: [ops]
  rc-2:
    <<: *rc
    volumes: [rc-2-data:/data]
  rc-3:
    <<: *rc
    volumes: [rc-3-data:/data]
  rc-4:
    <<: *rc
    volumes: [rc-4-data:/data]
  rc-5:
    <<: *rc
    volumes: [rc-5-data:/data]
  rc-6:
    <<: *rc
    volumes: [rc-6-data:/data]

  # 对外暴露集群入口，练习 MOVED/ASK 重定向
  cluster-gateway:
    <<: *restart
    image: alpine/socat:1.8.0.1
    profiles: ["redis-cluster"]
    command: ["TCP-LISTEN:7000,fork,reuseaddr", "TCP:rc-1:6379"]
    ports:
      - "7000:7000"
    depends_on: [rc-1]
    networks: [ops]

  # =====================================================================
  # db：MySQL / PostgreSQL
  # =====================================================================
  mysql:
    <<: *restart
    image: mysql:8.4
    profiles: ["db"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow-query-log=1
      - --long-query-time=1
      - --slow-query-log-file=/var/log/mysql/slow.log
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: labdb
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${LAB_ROOT:-.}/compose/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops]

  postgres:
    <<: *restart
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: labdb
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${LAB_ROOT:-.}/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops]

  # MySQL 主从练习用的第二个实例
  mysql-replica:
    <<: *restart
    image: mysql:8.4
    profiles: ["db", "db-ha"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    networks: [ops]

  # =====================================================================
  # mq：Kafka（KRaft 模式，不需要 ZooKeeper）/ RabbitMQ
  # =====================================================================
  kafka:
    <<: *restart
    image: apache/kafka:4.0.0
    profiles: ["mq"]
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [ops]

  rabbitmq:
    <<: *restart
    image: rabbitmq:4-management
    profiles: ["mq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [ops]

  # =====================================================================
  # cicd：Gitea + Actions Runner
  # =====================================================================
  gitea:
    <<: *restart
    image: gitea/gitea:1.24
    profiles: ["cicd"]
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HTTP_PORT}/
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__service__DISABLE_REGISTRATION: "false"
    ports:
      - "${GITEA_HTTP_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [ops]

  gitea-runner:
    <<: *restart
    image: gitea/act_runner:0.2.13
    profiles: ["cicd"]
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: CHANGE_ME
      GITEA_RUNNER_NAME: ops-lab-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitea-runner-data:/data
    depends_on: [gitea]
    networks: [ops]

  # =====================================================================
  # linux：Linux / 网络排障练习容器（手动进去练）
  # =====================================================================
  toolbox:
    <<: *restart
    image: nicolaka/netshoot:v0.14
    profiles: ["linux"]
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    networks: [ops]

  ubuntu-box:
    <<: *restart
    image: ubuntu:24.04
    profiles: ["linux"]
    command: ["sleep", "infinity"]
    networks: [ops]

  # 用于练习磁盘/压力/进程排查
  stress-target:
    <<: *restart
    image: ubuntu:24.04
    profiles: ["linux"]
    command: ["sleep", "infinity"]
    networks: [ops]

  # 演示应用：暴露 /metrics、输出日志、支持 OTLP tracing
  demo-app:
    <<: *restart
    image: golang:1.26-alpine
    working_dir: /app
    command: ["sh", "-c", "go mod tidy && go run ."]
    volumes:
      - ${LAB_ROOT:-.}/demos/demo-app:/app
      - go-mod-cache:/go/pkg/mod
    profiles: ["core", "tracing"]
    environment:
      OTEL_SERVICE_NAME: demo-app
    ports:
      - "8081:8081"
    networks: [ops]

networks:
  ops:
    name: ops-lab
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  redis-data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  rc-1-data:
  rc-2-data:
  rc-3-data:
  rc-4-data:
  rc-5-data:
  rc-6-data:
  mysql-data:
  mysql-replica-data:
  postgres-data:
  kafka-data:
  rabbitmq-data:
  gitea-data:
  gitea-runner-data:
  go-mod-cache:
