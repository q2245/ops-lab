# 统一告警的接触点配置
apiVersion: 1

contactPoints:
  - orgId: 1
    name: lab-webhook
    receivers:
      - uid: lab-webhook-1
        type: webhook
        settings:
          url: http://demo-app:8081/alerts
          httpMethod: POST

  - orgId: 1
    name: lab-dingtalk
    receivers:
      - uid: lab-dingtalk-1
        type: dingding
        settings:
          url: https://oapi.dingtalk.com/robot/send?access_token=REPLACE_ME
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: lab-webhook
    group_by: ["alertname", "instance"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 3h
    routes:
      - receiver: lab-dingtalk
        object_matchers:
          - ["severity", "=", "critical"]
        continue: false
