# HAProxy 四层/七层负载均衡练习
global
    log stdout format raw local0
    maxconn 2048
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# 管理界面：http://localhost:8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    http-request use-service prometheus-exporter if { path /metrics }

frontend http_in
    bind *:80
    default_backend web_pool

backend web_pool
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server backend_a backend-a:80 check inter 3s fall 3 rise 2
    server backend_b backend-b:80 check inter 3s fall 3 rise 2
